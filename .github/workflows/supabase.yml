name: Supabase (banco, funções e login)

# Aplica as migrations, publica as Edge Functions e configura o login (endereço do site, e-mails em
# português e SMTP). Sem os secrets do Supabase, não faz nada (o site fica em modo demonstração).
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'brand.json', 'scripts/auth-config.mjs', 'scripts/pluggy-webhook.mjs', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ] || [ -z "$DB_PASSWORD" ] || [ -z "$SETUP_CODE" ]; then
            echo "::notice::Supabase ainda não configurado (faltam secrets, veja o README). Nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(echo "$URL" | sed -E 's#https?://([^.]+)\..*#\1#')" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ needs.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Ligar ao projeto
        run: supabase link --project-ref "$PROJECT_REF"

      # Os servidores do GitHub não têm IPv6, e a conexão direta com o banco é só IPv6.
      # Por isso o banco é aplicado pelo "pooler" (IPv4), na região do projeto.
      - name: Aplicar o banco (migrations)
        run: |
          REGION=$(curl --fail --silent -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("region",""))')
          [ -n "$REGION" ] || REGION=sa-east-1
          PASS=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          for HOST in "aws-1-$REGION" "aws-0-$REGION"; do
            echo "Tentando $HOST.pooler.supabase.com ($REGION)"
            if supabase db push --db-url "postgresql://postgres.$PROJECT_REF:$PASS@$HOST.pooler.supabase.com:5432/postgres" --yes; then
              exit 0
            fi
          done
          echo "::error::Não consegui conectar ao banco pelo pooler. Confira a senha do banco (SUPABASE_DB_PASSWORD)."
          exit 1

      - name: Publicar Edge Functions
        run: supabase functions deploy --yes

      - name: Secrets das funções
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
        run: |
          supabase secrets set SETUP_CODE="$SETUP_CODE" --yes
          if [ -n "$PLUGGY_CLIENT_ID" ] && [ -n "$PLUGGY_CLIENT_SECRET" ]; then
            supabase secrets set PLUGGY_CLIENT_ID="$PLUGGY_CLIENT_ID" PLUGGY_CLIENT_SECRET="$PLUGGY_CLIENT_SECRET" --yes
          else
            echo "::notice::Sem chaves da Pluggy: a conexão com o banco fica desligada."
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --yes
          else
            echo "::notice::Sem GEMINI_API_KEY: o assistente fica desligado."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configurar login e e-mails
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: |
          node scripts/auth-config.mjs > auth.json
          STATUS=$(curl --silent --show-error -o resposta.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @auth.json)
          rm auth.json
          if [ "$STATUS" -ge 300 ]; then
            # Mostra o motivo que o Supabase deu (a resposta não tem segredos)
            echo "::error::O Supabase recusou a configuração do login (HTTP $STATUS)"
            cat resposta.json; echo
            exit 1
          fi
          rm resposta.json
          echo "Login configurado para $SITE_URL"

      # A Pluggy avisa quando o Meu Pluggy termina de atualizar um banco: o app busca na hora
      - name: Aviso da Pluggy (webhook)
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: node scripts/pluggy-webhook.mjs || echo "::warning::Não deu para registrar o aviso da Pluggy. O app continua atualizando ao abrir."
