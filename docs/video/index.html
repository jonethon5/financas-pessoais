<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e1830; }
      #root { width: 100%; height: 100%; position: relative; }
      /* Fundo: o azul do app, escurecido, com um brilho no alto */
      #fundo { position: absolute; inset: 0; background: radial-gradient(70% 60% at 30% 10%, #2f6feb 0%, rgb(47 111 235 / 0) 70%), linear-gradient(160deg, #16326f 0%, #0e1830 60%, #0a1124 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.8" data-width="1920" data-height="1080">
      <div id="fundo"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="hoje" data-composition-id="hoje" data-composition-src="compositions/hoje.html" data-start="4.2" data-duration="4.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="mes" data-composition-id="mes" data-composition-src="compositions/mes.html" data-start="8.8" data-duration="4.6" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="extrato" data-composition-id="extrato" data-composition-src="compositions/extrato.html" data-start="13.4" data-duration="4.6" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="caixinhas" data-composition-id="caixinhas" data-composition-src="compositions/caixinhas.html" data-start="18" data-duration="4.4" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="computador" data-composition-id="computador" data-composition-src="compositions/computador.html" data-start="22.4" data-duration="4.4" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fim" data-composition-id="fim" data-composition-src="compositions/fim.html" data-start="26.8" data-duration="4" data-track-index="7" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
